name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint
        run: ruff check backend

      - name: Syntax & import check
        run: |
          python -m compileall -q backend
          python -c "import backend.app.main; print('import ok')"

      - name: Unit tests
        run: pytest -q tests

  eval:
    # 用离线 mock 模式跑评测，验证「检索 + 决策 + 计算」链路没有回归。
    # 不需要 API Key，不消耗额度，指标可复现。
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache embedding model + index
        id: cache-data
        uses: actions/cache@v4
        with:
          path: |
            backend/data/models
            backend/data/stardewpal.db
          key: data-v1-${{ hashFiles('backend/pipeline/*.py') }}

      - name: Download embedding model
        run: python -m backend.pipeline.fetch_model

      - name: Fetch corpus and build index (first run only)
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: |
          # 抓取有 1 req/s 限速，全量约 1.5 小时，超出 CI 时限。
          # 这里只抓前若干页做冒烟验证；完整索引应预先构建并缓存。
          echo "索引未命中缓存，跳过全量抓取（需预先构建并上传缓存）"
          exit 0

      - name: Run evaluation (mock mode)
        run: |
          if [ ! -f backend/data/stardewpal.db ]; then
            echo "::warning::索引不存在，跳过评测。请在有数据的机器上构建后填充 cache key 为 data-v1。"
            exit 0
          fi
          LLM_PROVIDER=mock python -m backend.pipeline.run_eval --per-type 30 --regenerate

      - name: Upload eval result
        uses: actions/upload-artifact@v4
        with:
          name: eval-result
          path: backend/data/runs/*.json
          if-no-files-found: ignore
