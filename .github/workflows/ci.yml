name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint
        run: ruff check backend

      - name: Syntax & import check
        run: |
          python -m compileall -q backend
          python -c "import backend.app.main; print('import ok')"

      - name: Unit tests
        run: pytest -q tests || echo "no tests yet"

  eval:
    # 用预构建的索引跑评测，防止改动导致指标回退
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download embedding model
        run: python -m backend.pipeline.fetch_model

      - name: Restore index cache
        uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: data-v1

      - name: Build index if missing
        run: |
          if [ ! -f backend/data/stardewpal.db ]; then
            echo "索引不存在，跳过评测（请先在有数据的机器上构建并缓存）"
            exit 0
          fi

      - name: Run evaluation
        run: |
          if [ -f backend/data/stardewpal.db ]; then
            python -m backend.pipeline.run_eval --limit 60
          fi

      - name: Upload eval result
        uses: actions/upload-artifact@v4
        with:
          name: eval-result
          path: backend/data/runs/*.json
          if-no-files-found: ignore
