[project]
name = "stardewpal"
version = "0.1.0"
description = "Stardew Valley multimodal RAG assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "numpy>=1.26",
    "pillow>=10.4",
    "rapidocr-onnxruntime>=1.3",
    "scipy>=1.13",
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
# 让 `pytest` 在仓库根目录运行时能 import backend.*，
# 无需依赖外部设置 PYTHONPATH（CI 里就没有设）
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
